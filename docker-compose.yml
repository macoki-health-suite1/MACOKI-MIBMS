services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: macoki_mibms
      POSTGRES_USER: macoki
      POSTGRES_PASSWORD: change-me-for-local-development
    ports:
      - "5432:5432"
    volumes:
      - macoki_mibms_pgdata:/var/lib/postgresql/data
volumes:
  macoki_mibms_pgdata:
